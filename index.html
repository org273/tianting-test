<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天庭编制测试</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fdf6ee;--card:#fff;--text:#1a1b1c;--text2:#6b7280;--line:#e8e0d4;
  --gold:#8a5a2a;--gold-light:#e1b98f;--red:#c47a86;--green:#5a9a6a;--blue:#4a7bc4;
}
html,body{background:#f0e8dc;font-family:'Noto Sans SC','PingFang SC',sans-serif;color:var(--text);line-height:1.6}
body{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.screen{display:none;min-height:100vh;padding:24px 20px 40px}
.screen.active{display:block}
h1,h2,h3{font-family:'Noto Serif SC',serif}

/* ===== 密码门 ===== */
#screen-password{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;text-align:center}
.lock-icon{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#e1b98f,#c99a5e);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.lock-icon svg{width:36px;height:36px;fill:#fff}
#screen-password h1{font-size:24px;font-weight:700;margin-bottom:8px;letter-spacing:2px}
#screen-password .sub{font-size:13px;color:var(--text2);margin-bottom:32px}
.pwd-input{width:100%;max-width:300px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;text-align:center;letter-spacing:4px;outline:none;background:#fff;transition:border-color .2s}
.pwd-input:focus{border-color:var(--gold)}
.pwd-error{color:#e05050;font-size:12px;margin-top:10px;min-height:18px}
.btn{display:block;width:100%;max-width:300px;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;text-align:center}
.btn-primary{background:linear-gradient(135deg,#8a5a2a,#a67842);color:#fff;margin-top:16px}
.btn-primary:active{opacity:.85}
.btn-outline{background:transparent;border:1.5px solid var(--gold);color:var(--gold)}
.admin-entry{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#ccc;cursor:pointer;user-select:none}

/* ===== 欢迎页 ===== */
#screen-welcome{text-align:center;padding-top:60px}
.hero-img{width:180px;height:180px;border-radius:20px;margin:0 auto 24px;object-fit:cover;box-shadow:0 8px 24px rgba(138,90,42,.15)}
#screen-welcome h1{font-size:26px;font-weight:700;margin-bottom:12px}
#screen-welcome .desc{font-size:13px;color:var(--text2);max-width:320px;margin:0 auto 32px;line-height:1.8}
.times-left{font-size:13px;color:var(--gold);background:rgba(225,185,143,.15);padding:6px 16px;border-radius:20px;display:inline-block;margin-bottom:20px}

/* ===== 答题页 ===== */
.progress-bar{width:100%;height:6px;background:var(--line);border-radius:3px;margin-bottom:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#8a5a2a,#c99a5e);border-radius:3px;transition:width .3s}
.q-progress-text{font-size:12px;color:var(--text2);margin-bottom:24px;text-align:right}
.q-text{font-size:19px;font-weight:600;font-family:'Noto Serif SC',serif;margin-bottom:24px;line-height:1.5}
.opt{display:block;width:100%;padding:16px;margin-bottom:12px;background:#fff;border:1.5px solid var(--line);border-radius:12px;font-size:14px;text-align:left;cursor:pointer;transition:all .2s;color:var(--text);line-height:1.5}
.opt.selected{border-color:var(--gold);background:rgba(225,185,143,.12)}
.opt:active{background:#faf5ec}
.nav-row{display:flex;gap:10px;margin-top:20px}
.nav-row .btn{margin-top:0;flex:1}
.btn-back{background:#f5f0e8;color:var(--text2);border:1.5px solid var(--line)}
.btn-next{background:var(--gold);color:#fff}
.btn-next:disabled{opacity:.4;cursor:not-allowed}

/* ===== 结果页 ===== */
#screen-result{padding-top:20px}
.result-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(138,90,42,.08)}
.result-hero{background:linear-gradient(180deg,#fdf0e0,#fff);padding:28px 20px 20px;text-align:center}
.result-god-name{font-size:36px;font-weight:900;letter-spacing:8px;font-family:'Noto Serif SC',serif;color:var(--gold)}
.result-god-title{font-size:12px;color:var(--text2);margin-top:6px;letter-spacing:2px}
.result-pop{font-size:11px;color:#999;margin-top:8px}
.result-img{width:140px;height:140px;border-radius:16px;margin:16px auto;display:block;object-fit:cover}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.tag{font-size:11px;padding:4px 12px;border-radius:12px;background:rgba(196,122,134,.12);color:var(--red)}
.radar-box{padding:16px 20px;background:#faf7f2}
.radar-title{font-size:12px;font-weight:600;color:var(--gold);margin-bottom:10px}
.radar-item{margin-bottom:8px}
.radar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:3px}
.radar-track{height:6px;background:#eee;border-radius:3px;overflow:hidden}
.radar-fill{height:100%;background:linear-gradient(90deg,#c99a5e,#e1b98f);border-radius:3px}
.sec{padding:16px 20px;border-top:1px solid var(--line)}
.sec h3{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--gold)}
.sec p{font-size:13px;color:#374151;line-height:1.8}
.sec .psych{background:rgba(155,187,244,.08);padding:12px;border-radius:10px}
.sec .psych h3{color:var(--blue)}
.sec .pitfall h3{color:#e05050}
.advice{margin:16px 20px;padding:12px;background:rgba(196,122,134,.1);border-radius:10px;text-align:center;font-size:12px;color:var(--red)}
.action-row{display:flex;gap:10px;margin:20px 0}
.action-row .btn{margin-top:0;flex:1;padding:12px;font-size:13px}
.btn-save{background:var(--gold);color:#fff}
.btn-copy{background:#fff;border:1.5px solid var(--gold);color:var(--gold)}
.btn-retake{background:#fff;border:1.5px solid var(--line);color:var(--text2)}
.btn-review{background:linear-gradient(135deg,#e8a84c,#d4882a);color:#fff}
.share-tip{font-size:11px;color:#999;text-align:center;margin-top:8px;min-height:16px}

/* ===== 弹窗 ===== */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:28px 24px;max-width:340px;width:100%;text-align:center}
.modal h3{font-size:18px;margin-bottom:12px;color:var(--gold)}
.modal p{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:20px}
.modal .btn{margin-top:0}

/* ===== 管理员页 ===== */
#screen-admin{padding-top:20px}
#screen-admin h2{font-size:20px;margin-bottom:16px}
.admin-section{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px}
.admin-section h3{font-size:14px;margin-bottom:10px;color:var(--gold)}
.admin-input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;outline:none;margin-bottom:10px}
.pwd-list{max-height:300px;overflow-y:auto;font-size:12px}
.pwd-row{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #f0ece4}
.pwd-row .pwd{font-family:monospace;letter-spacing:1px}
.pwd-row .used{color:var(--text2);font-size:11px}
.pwd-row .used.exceed{color:#e05050}
.admin-btn{padding:8px 14px;font-size:12px;border:none;border-radius:8px;background:var(--gold);color:#fff;cursor:pointer;margin-right:6px;margin-top:6px}
.admin-btn.outline{background:#f5f0e8;color:var(--gold)}
.seed-box{width:100%;height:80px;font-size:10px;font-family:monospace;padding:8px;border:1px solid var(--line);border-radius:6px;resize:vertical}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- 密码门 -->
<div class="screen active" id="screen-password">
  <div class="lock-icon">
    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
  </div>
  <h1>天庭编制测试</h1>
  <div class="sub">输入密码开始测试 · 每个密码可测3次</div>
  <input type="text" class="pwd-input" id="pwd-input" placeholder="请输入密码" maxlength="12" autocomplete="off">
  <div class="pwd-error" id="pwd-error"></div>
  <button class="btn btn-primary" onclick="verifyPassword()">开始测试</button>
  <div class="admin-entry" onclick="adminClick()">管理员入口</div>
</div>

<!-- 欢迎页 -->
<div class="screen" id="screen-welcome">
  <img class="hero-img" src="https://aka.doubaocdn.com/s/hOPhyqxTDy" alt="天庭编制测试">
  <h1>你在天庭是什么编制？</h1>
  <div class="desc">16道真实场景题，测出你的天庭岗位 + 编制等级。<br>原来神仙也在打工。</div>
  <div class="times-left" id="times-left"></div>
  <button class="btn btn-primary" onclick="startQuiz()">开始答题</button>
</div>

<!-- 答题页 -->
<div class="screen" id="screen-quiz">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="q-progress-text" id="q-progress-text"></div>
  <div class="q-text" id="q-text"></div>
  <div id="options-box"></div>
  <div class="nav-row">
    <button class="btn btn-back" id="btn-back" onclick="prevQuestion()">上一题</button>
    <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">下一题</button>
  </div>
</div>

<!-- 结果页 -->
<div class="screen" id="screen-result">
  <div class="result-card">
    <div class="result-hero">
      <div class="result-god-name" id="r-name"></div>
      <div class="result-god-title" id="r-title"></div>
      <div class="result-pop" id="r-pop"></div>
      <img class="result-img" id="r-img" src="">
      <div class="tag-row" id="r-tags"></div>
    </div>
    <div class="radar-box">
      <div class="radar-title">五维法力值</div>
      <div id="r-radar"></div>
    </div>
    <div class="sec">
      <h3>你的天庭日常</h3>
      <p id="r-daily"></p>
    </div>
    <div class="sec psych">
      <h3>心理学解读</h3>
      <p id="r-psych"></p>
    </div>
    <div class="sec">
      <h3>你的天赋</h3>
      <p id="r-talent"></p>
    </div>
    <div class="sec pitfall">
      <h3>你的盲区</h3>
      <p id="r-pitfall"></p>
    </div>
    <div class="advice" id="r-advice"></div>
    <div class="sec">
      <h3>你的神仙搭档</h3>
      <p id="r-partner"></p>
    </div>
    <div class="sec">
      <h3>渡劫提醒</h3>
      <p id="r-trib"></p>
    </div>
    <div class="sec">
      <h3>前世今生</h3>
      <p id="r-past"></p>
    </div>
  </div>

  <div class="action-row">
    <button class="btn btn-save" onclick="saveImage()">保存长图</button>
    <button class="btn btn-copy" onclick="copyLink()">复制链接</button>
  </div>
  <div class="action-row">
    <button class="btn btn-retake" onclick="retake()">再测一次</button>
    <button class="btn btn-review" onclick="showReview()">好评有礼</button>
  </div>
  <div class="share-tip" id="share-tip"></div>
</div>

<!-- 好评弹窗 -->
<div class="modal-mask" id="review-modal">
  <div class="modal">
    <h3>好评有礼</h3>
    <p>在店铺完成好评后，请联系客服发送好评截图，即可领取 1 元返现。</p>
    <button class="btn btn-primary" onclick="closeReview()">我知道了</button>
  </div>
</div>

<!-- 管理员页 -->
<div class="screen" id="screen-admin">
  <h2>管理员后台</h2>
  <div class="admin-section">
    <h3>生成随机密码</h3>
    <input class="admin-input" type="number" id="gen-count" value="20" min="1" max="200" placeholder="生成数量">
    <button class="admin-btn" onclick="genPasswords()">生成密码</button>
  </div>
  <div class="admin-section">
    <h3>密码列表（点导出种子后粘贴回HTML）</h3>
    <div class="pwd-list" id="admin-pwd-list"></div>
    <button class="admin-btn" onclick="exportPasswords()">复制密码列表</button>
    <button class="admin-btn outline" onclick="exportSeed()">复制种子代码</button>
    <button class="admin-btn outline" onclick="resetAll()">重置全部次数</button>
  </div>
  <div class="admin-section">
    <h3>种子代码（粘贴回 HTML 中 INITIAL_PASSWORDS）</h3>
    <textarea class="seed-box" id="seed-output" readonly></textarea>
  </div>
  <button class="btn btn-back" onclick="location.reload()">返回前台</button>
</div>

<div class="toast" id="toast"></div>

// ====== Supabase 密码操作 ======
async function fetchPassword(pwd){
  const r = await fetch(SUPABASE_URL+'/rest/v1/passwords?password=eq.'+pwd, {headers:SB_HEADERS});
  const d = await r.json();
  return d[0] || null;
}
async function incrementPassword(pwd){
  const cur = await fetchPassword(pwd);
  if(!cur) return null;
  const r = await fetch(SUPABASE_URL+'/rest/v1/passwords?password=eq.'+pwd, {
    method:'PATCH', headers:SB_HEADERS,
    body: JSON.stringify({used_count: cur.used_count+1})
  });
  return r.json();
}
async function verifyPassword(){
  const input = document.getElementById('pwd-input').value.trim().toUpperCase();
  const errEl = document.getElementById('pwd-error');
  if(!input){ errEl.textContent='请输入密码'; return; }
  errEl.textContent = '验证中...';
  try{
    const row = await fetchPassword(input);
    if(!row){ errEl.textContent='密码无效，请检查后重试'; return; }
    if(row.used_count >= 3){ errEl.textContent='该密码已用完3次，请联系购买'; return; }
    await incrementPassword(input);
    currentPwd = input;
    showScreen('welcome');
    const left = 3 - (row.used_count+1);
    document.getElementById('times-left').textContent = '本密码剩余测试次数：' + left + ' 次';
  }catch(e){
    errEl.textContent = '网络错误，请稍后重试';
  }
}

// ====== 视图切换 ======
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  window.scrollTo(0,0);
}

// ====== 答题 ======
function startQuiz(){
  currentQ = 0;
  answers = [];
  showScreen('quiz');
  renderQuestion();
}
function renderQuestion(){
  const q = QUESTIONS[currentQ];
  selectedOpt = answers[currentQ] !== undefined ? answers[currentQ] : -1;
  document.getElementById('progress-fill').style.width = ((currentQ)/QUESTIONS.length*100)+'%';
  document.getElementById('q-progress-text').textContent = (currentQ+1)+' / '+QUESTIONS.length;
  document.getElementById('q-text').textContent = q.q;
  const box = document.getElementById('options-box');
  box.innerHTML = '';
  q.opts.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt'+(i===selectedOpt?' selected':'');
    b.textContent = String.fromCharCode(65+i)+'. '+opt;
    b.onclick = ()=>selectOpt(i);
    box.appendChild(b);
  });
  document.getElementById('btn-back').style.visibility = currentQ===0?'hidden':'visible';
  document.getElementById('btn-next').textContent = currentQ===QUESTIONS.length-1?'查看结果':'下一题';
}
function selectOpt(i){
  selectedOpt = i;
  answers[currentQ] = i;
  renderQuestion();
}
function prevQuestion(){ if(currentQ>0){ currentQ--; renderQuestion(); } }
function nextQuestion(){
  if(selectedOpt<0 && answers[currentQ]===undefined){ showToast('请先选择一个答案'); return; }
  if(currentQ < QUESTIONS.length-1){
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

    dimScores[q.dim] += (answers[i]!==undefined ? (4-answers[i]) : 0);
  });
  // 折算0-10
  const dims = dimScores.map((s,i)=> s/dimMax[i]*10);
  // 找最近神仙
  let best = 0, bestDist = Infinity;
  GODS.forEach((g,gi)=>{
    let d = 0;
    for(let k=0;k<6;k++){ d += Math.pow(dims[k]-g.dims[k],2); }
    if(d<bestDist){ bestDist=d; best=gi; }
  });
  return {god:GODS[best], dims:dims};
}

// ====== 长图导出 ======
function saveImage(){
  const god = GODS.find(g=>g.name===document.getElementById('r-name').textContent);
  const canvas = document.createElement('canvas');
  canvas.width = 750;
  canvas.height = 1500;
  const ctx = canvas.getContext('2d');
  // 背景
  const grad = ctx.createLinearGradient(0,0,0,1500);
  grad.addColorStop(0,'#fdf0e0');
  grad.addColorStop(0.3,'#ffffff');
  grad.addColorStop(1,'#fdf6ee');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,750,1500);
  // 标题
  ctx.fillStyle = '#8a5a2a';
  ctx.font = 'bold 28px "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText('天庭编制测试', 375, 60);
  // 神仙名
  ctx.font = 'bold 64px "Noto Serif SC", serif';
  ctx.fillText(god.name, 375, 150);
  ctx.font = '16px "Noto Sans SC", sans-serif';
  ctx.fillStyle = '#6b7280';
  ctx.fillText(god.title, 375, 185);
  // 插画
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function(){
    ctx.save();
    ctx.beginPath();
    ctx.arc(375, 310, 110, 0, Math.PI*2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(img, 265, 200, 220, 220);
    ctx.restore();
    // 标签
    ctx.font = '14px "Noto Sans SC", sans-serif';
    let tx = 375 - (god.tags.join('  ·  ').length*8)/2;
    ctx.fillStyle = '#c47a86';
    ctx.fillText(god.tags.join('  ·  '), 375, 460);
    // 雷达数据
    ctx.fillStyle = '#8a5a2a';
    ctx.font = 'bold 18px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('五维法力值', 60, 520);
    god.radar.forEach((r,i)=>{
      const y = 555 + i*38;
      ctx.fillStyle = '#6b7280';
      ctx.font = '14px "Noto Sans SC", sans-serif';
      ctx.fillText(r.label, 60, y);
      ctx.fillStyle = '#e8e0d4';
      ctx.fillRect(180, y-11, 450, 14);
      ctx.fillStyle = '#c99a5e';
      ctx.fillRect(180, y-11, 450*r.v/100, 14);
      ctx.fillStyle = '#8a5a2a';
      ctx.font = 'bold 14px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(r.v, 650, y);
      ctx.textAlign = 'left';
    });
    // 文案
    ctx.fillStyle = '#1a1b1c';
    ctx.font = '15px "Noto Sans SC", sans-serif';
    wrapText(ctx, '你的天庭日常：', 60, 800, 630, 24, '#8a5a2a', true);
    wrapText(ctx, god.daily, 60, 828, 630, 22, '#374151', false);
    wrapText(ctx, '你的盲区：', 60, 1080, 630, 24, '#e05050', true);
    wrapText(ctx, god.pitfall, 60, 1108, 630, 22, '#374151', false);
    // 底部
    ctx.fillStyle = '#999';
    ctx.font = '13px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('扫码测测你在天庭是什么编制', 375, 1450);
    // 导出
    try {
      canvas.toBlob(blob=>{
        if(!blob){ throw new Error('导出失败'); }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '天庭编制测试-'+god.name+'.png';
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById('share-tip').textContent = '长图已保存到下载目录';
      });
    } catch(e){
      document.getElementById('share-tip').textContent = '自动保存失败，请长按截图保存';
    }
  };
  img.src = god.img;
}

function wrapText(ctx, text, x, y, maxW, lh, color, bold){
  ctx.fillStyle = color;
  ctx.font = (bold?'bold ':'')+'15px "Noto Sans SC", sans-serif';
  const chars = text.split('');
  let line = '';
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, x, y);
      line = chars[i];
      y += lh;
    } else {
      line = test;
    }
  }
  if(line) ctx.fillText(line, x, y);
}

let adminClickCount = 0;

    showScreen('admin');

}
async function genPasswords(){
  const n = parseInt(document.getElementById('gen-count').value)||20;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const batch = [];
  for(let i=0;i<n;i++){
    let pwd = '';
    for(let j=0;j<6;j++) pwd += chars[Math.floor(Math.random()*chars.length)];
    batch.push({password: pwd, used_count: 0});
  }
  try{
    await fetch(SUPABASE_URL+'/rest/v1/passwords', {
      method:'POST', headers:SB_HEADERS, body: JSON.stringify(batch)
    });
    showToast('已生成 '+n+' 个密码');
    renderAdminList();
  }catch(e){
    showToast('生成失败：'+e.message);
  }
}
async function renderAdminList(){
  const box = document.getElementById('admin-pwd-list');
  box.innerHTML = '<div style="color:#999;font-size:12px;padding:8px;">加载中...</div>';
  try{
    const r = await fetch(SUPABASE_URL+'/rest/v1/passwords?select=*&order=created_at.desc&limit=500', {headers:SB_HEADERS});
    const rows = await r.json();
    box.innerHTML = '';
    rows.forEach(row=>{
      const used = row.used_count;
      const div = document.createElement('div');
      div.className = 'pwd-row';
      div.innerHTML = '<span class="pwd">'+row.password+'</span><span class="used'+(used>=3?' exceed':'')+'">已用 '+used+'/3</span>';
      box.appendChild(div);
    });
  }catch(e){
    box.innerHTML = '<div style="color:#e05050;font-size:12px;padding:8px;">加载失败：'+e.message+'</div>';
  }
}
async function exportPasswords(){
  try{
    const r = await fetch(SUPABASE_URL+'/rest/v1/passwords?select=password', {headers:SB_HEADERS});
    const rows = await r.json();
    const list = rows.map(x=>x.password).join('\n');
    navigator.clipboard.writeText(list).then(()=>showToast('密码列表已复制'));
  }catch(e){ showToast('导出失败'); }
}
